name: Build and Test

on:
  - pull_request
  - push

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -G 'Unix Makefiles' .
      - name: Build
        run: make VERBOSE=1
      - name: Test
        run: make VERBOSE=1 ARGS=--verbose test

  windows-32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -A Win32 .
      - name: Build
        run: cmake --build . --config Release
      - name: Test
        run: ctest -C Release --verbose

  windows-64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -A x64 .
      - name: Build
        run: cmake --build . --config Release
      - name: Test
        run: ctest -C Release --verbose
